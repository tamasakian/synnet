[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "synnet"
version = "0.1.0"
description = "Build syntenic ortholog networks from MCScanX collinearity files"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
synnet = "synnet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synnet"]
